<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify Lyrics Overlay</title>
<style>
  :root { --size: 44px; --color: #ffffff; --dim: .35; --font: "Segoe UI", system-ui, sans-serif; }
  html { background: transparent !important; }
  body { margin: 0; }
  body.overlay { background: transparent !important; font-family: var(--font); color: var(--color);
    overflow: hidden; height: 100vh; position: relative; text-align: center;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 90%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 90%, transparent 100%); }
  #track { position: absolute; left: 0; right: 0; top: 50%; will-change: transform;
    transition: transform .6s cubic-bezier(.22, .8, .3, 1); }
  .line { font-size: var(--size); font-weight: 700; line-height: 1.25; padding: .25em 24px; opacity: 0;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); transform: scale(.94);
    transition: opacity .5s, transform .5s; }
  .line.cur { transform: scale(1.04); }
  body.setup { background: #14161a; color: #e8e8ea; font-family: system-ui, sans-serif; padding: 32px; }
  .setup main { max-width: 640px; margin: auto; }
  .setup h1 { font-size: 22px; }
  .setup button { background: #1db954; border: 0; color: #000; font-weight: 600; padding: 10px 18px; border-radius: 20px; cursor: pointer; }
  .setup input { width: 100%; box-sizing: border-box; padding: 8px; background: #0b0c0e; color: #e8e8ea; border: 1px solid #333; border-radius: 6px; margin: 6px 0 12px; }
  .setup code { background: #0b0c0e; padding: 2px 5px; border-radius: 4px; }
  .muted { color: #9a9aa2; font-size: 14px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
// ====== CONFIG: paste your Spotify app Client ID here ======
const CLIENT_ID = "62231e5294fe4abfbbfea850ce0b54b0";
// ===========================================================

const REDIRECT = location.origin + location.pathname;
const SCOPE = "user-read-currently-playing user-read-playback-state";
const hashParams = new URLSearchParams(location.hash.slice(1));
const app = document.getElementById("app");

// ---------- PKCE helpers ----------
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
async function pkcePair() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  return { verifier, challenge };
}
async function tokenRequest(body) {
  const r = await fetch("https://accounts.spotify.com/api/token", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: CLIENT_ID, ...body })
  });
  if (!r.ok) throw new Error("token " + r.status);
  return r.json();
}

// ---------- Entry ----------
(async function main() {
  const code = new URLSearchParams(location.search).get("code");
  if (hashParams.get("rt")) return startOverlay(hashParams.get("rt"));
  if (code) {
    try {
      const t = await tokenRequest({
        grant_type: "authorization_code", code, redirect_uri: REDIRECT,
        code_verifier: localStorage.getItem("verifier") || ""
      });
      localStorage.setItem("rt", t.refresh_token);
      history.replaceState(null, "", REDIRECT);
    } catch (e) { console.error(e); }
  }
  showSetup();
})();

// ---------- Setup UI ----------
function showSetup() {
  document.body.className = "setup";
  const rt = localStorage.getItem("rt");
  const obsUrl = rt ? `${REDIRECT}#rt=${rt}&size=44&offset=0&lines=3` : "";
  app.innerHTML = `<main>
    <h1>Spotify Lyrics Overlay</h1>
    <p class="muted">Redirect URI to register in your Spotify app: <code>${REDIRECT}</code></p>
    <button id="connect">${rt ? "Reconnect Spotify" : "Connect Spotify"}</button>
    ${rt ? `<h3>OBS Browser Source URL</h3>
    <input id="url" readonly value="${obsUrl}">
    <p class="muted">Keep this URL private; it contains your refresh token. Options (after the token, joined with &amp;):
    <code>size</code> (px), <code>color</code> (hex without #), <code>offset</code> (ms, negative = earlier), <code>lines</code> (1, 3 or 5), <code>dim</code> (0 to 1, brightness of the other lines), <code>font</code>.
    Suggested OBS size 1280x300. Clear the default custom CSS in OBS.</p>` : ""}
  </main>`;
  document.getElementById("connect").onclick = async () => {
    if (CLIENT_ID.startsWith("YOUR_")) return alert("Set CLIENT_ID in the file first.");
    const { verifier, challenge } = await pkcePair();
    localStorage.setItem("verifier", verifier);
    location.href = "https://accounts.spotify.com/authorize?" + new URLSearchParams({
      client_id: CLIENT_ID, response_type: "code", redirect_uri: REDIRECT,
      scope: SCOPE, code_challenge_method: "S256", code_challenge: challenge
    });
  };
  const u = document.getElementById("url");
  if (u) u.onclick = () => u.select();
}

// ---------- Overlay ----------
function startOverlay(initialRt) {
  document.body.className = "overlay";
  const root = document.documentElement.style;
  if (hashParams.get("size")) root.setProperty("--size", hashParams.get("size") + "px");
  if (hashParams.get("color")) root.setProperty("--color", "#" + hashParams.get("color"));
  if (hashParams.get("font")) root.setProperty("--font", hashParams.get("font"));
  const offset = parseInt(hashParams.get("offset") || "0", 10);
  const dimParam = parseFloat(hashParams.get("dim"));
  const dim = isNaN(dimParam) ? 0.6 : Math.min(1, Math.max(0, dimParam));   // brightness of non-current lines
  const nLines = [1, 3, 5].includes(+hashParams.get("lines")) ? +hashParams.get("lines") : 3;
  const half = (nLines - 1) / 2;

  app.innerHTML = '<div id="track"></div>';
  const track = document.getElementById("track");
  let els = [];

  let refreshToken = initialRt, accessToken = null, expires = 0;
  async function getToken() {
    if (accessToken && Date.now() < expires - 30000) return accessToken;
    const t = await tokenRequest({ grant_type: "refresh_token", refresh_token: refreshToken });
    accessToken = t.access_token;
    expires = Date.now() + t.expires_in * 1000;
    if (t.refresh_token) refreshToken = t.refresh_token;
    return accessToken;
  }

  // state
  let trackId = null, lyrics = [], progress = 0, playing = false, syncedAt = 0, lastIdx = -2;
  const cache = new Map();

  function parseLrc(lrc) {
    const out = [];
    for (const raw of lrc.split("\n")) {
      const m = raw.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/);
      if (m) out.push({ t: (parseInt(m[1], 10) * 60 + parseFloat(m[2])) * 1000, text: m[3].trim() });
    }
    return out.sort((a, b) => a.t - b.t);
  }

  async function fetchLyrics(item) {
    if (cache.has(item.id)) return cache.get(item.id);
    const q = new URLSearchParams({
      track_name: item.name, artist_name: item.artists[0].name,
      album_name: item.album.name, duration: Math.round(item.duration_ms / 1000)
    });
    const timedFetch = (url, ms = 8000) => {
      const c = new AbortController();
      setTimeout(() => c.abort(), ms);
      return fetch(url, { signal: c.signal });
    };
    let synced = null, failed = false;
    try {
      let r = await timedFetch("https://lrclib.net/api/get?" + q);
      if (r.ok) synced = (await r.json()).syncedLyrics;
      if (!synced) {
        r = await timedFetch("https://lrclib.net/api/search?" + new URLSearchParams({ track_name: item.name, artist_name: item.artists[0].name }));
        if (r.ok) synced = ((await r.json()).find(x => x.syncedLyrics) || {}).syncedLyrics;
      }
    } catch (e) { failed = true; console.warn("lrclib", e); }
    const parsed = synced ? parseLrc(synced) : [];
    if (!failed) cache.set(item.id, parsed);   // don't cache network failures
    return parsed;
  }

  async function poll() {
    try {
      const r = await fetch("https://api.spotify.com/v1/me/player/currently-playing", {
        headers: { Authorization: "Bearer " + await getToken() }
      });
      if (r.status === 204 || r.status === 202) { playing = false; lyrics = []; trackId = null; lastIdx = -2; render(true); }
      else if (r.status === 429) { await new Promise(res => setTimeout(res, (+r.headers.get("Retry-After") || 5) * 1000)); }
      else if (r.ok) {
        const d = await r.json();
        if (d.item && d.currently_playing_type === "track") {
          progress = d.progress_ms; playing = d.is_playing; syncedAt = performance.now();
          if (d.item.id !== trackId) {
            trackId = d.item.id; lyrics = []; lastIdx = -2;
            const id = trackId;
            // don't await: a slow lyrics lookup must never block Spotify polling
            fetchLyrics(d.item)
              .then(ls => { if (id === trackId) { lyrics = ls; lastIdx = -2; } })
              .catch(e => console.warn(e));
          }
        }
      }
    } catch (e) { console.warn(e); }
    setTimeout(poll, 2500);
  }

  let built = null, jump = true;
  function render(force) {
    const pos = progress + (playing ? performance.now() - syncedAt : 0) + offset;
    let idx = -1;
    for (let i = 0; i < lyrics.length; i++) { if (lyrics[i].t <= pos) idx = i; else break; }
    if (built !== lyrics) {            // new song: rebuild lines and snap into place
      built = lyrics; jump = true; lastIdx = -2;
      track.innerHTML = "";
      els = lyrics.map(l => {
        const d = document.createElement("div");
        d.className = "line"; d.textContent = l.text || "♪";
        track.appendChild(d);
        return d;
      });
    }
    if (idx === lastIdx && !force) return;
    lastIdx = idx;
    if (jump) track.style.transition = "none";
    const cur = els[idx];
    const y = cur ? cur.offsetTop + cur.offsetHeight / 2 : 0;
    track.style.transform = `translateY(${-y}px)`;
    els.forEach((el, i) => {
      const d = Math.abs(i - idx);
      el.style.opacity = d === 0 ? 1 : d <= half ? dim : 0;
      el.classList.toggle("cur", d === 0);
    });
    if (jump) { void track.offsetHeight; track.style.transition = ""; jump = false; }
  }
  (function loop() {
    try { render(); } catch (e) { console.warn("render", e); }   // never let the loop die
    requestAnimationFrame(loop);
  })();
  poll();
}
</script>
</body>
</html>
